name: domotique-bulle

networks:
  domotique_net:
    name: domotique_net
    driver: bridge

services:

  homeassistant:
    container_name: homeassistant
    image: homeassistant/home-assistant:stable
    restart: unless-stopped
    networks:
      - domotique_net
    ports:
      - "8123:8123"
    volumes:
      - ./HomeAssistant_Data:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ}
    # NOTE KNX : si l'interface KNX utilisée fonctionne en mode "routage"
    # (multicast 224.0.23.12) plutôt qu'en "tunneling" (connexion unicast
    # à une IP fixe), le réseau bridge de Docker Desktop pour Mac ne relaiera
    # pas le multicast correctement. Voir README.md § "KNX et réseau Docker"
    # avant de finaliser la configuration KNX.

  glasshome:
    container_name: glasshome
    image: ghcr.io/glasshome/dash:latest
    restart: unless-stopped
    networks:
      - domotique_net
    ports:
      - "3123:3123"  # interface web GlassHome — accès LAN direct ; exposition publique via le tunnel
                      # Cloudflare (Public Hostname à ajouter côté dashboard Zero Trust) possible plus
                      # tard si besoin, comme pour doc-knx / tesla-key.
    volumes:
      - ./GlassHome_Data:/data
    depends_on:
      - homeassistant
    # Jalon 5 (dashboards) — "Piste GlassHome" du comparatif à 3 technologies (GlassHome / Tunet /
    # cartes natives HA, cf. dashboard "test-dashboards" dans HA). La connexion à Home Assistant
    # (token d'accès longue durée) et la mise en page des pages se configurent depuis l'interface
    # web GlassHome (http://<IP-du-serveur>:3123), pas dans ce fichier. Version gratuite (core)
    # utilisée pour la comparaison ; passage à la version PRO (39.99$ à vie, achat unique) possible
    # plus tard sans changer cette configuration Docker.

  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    restart: unless-stopped
    networks:
      - domotique_net
    ports:
      - "127.0.0.1:9090:9090"  # accès local uniquement (debug/targets), jamais exposé publiquement
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/ha_bearer_token:/etc/prometheus/ha_bearer_token:ro
      - ./Prometheus_Data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=2d"
      # Rétention locale volontairement courte : VictoriaMetrics est la
      # base de stockage long terme (remote_write), Prometheus ne sert
      # ici que de collecteur/relais.
    depends_on:
      - homeassistant
      - victoriametrics

  victoriametrics:
    container_name: victoriametrics
    image: victoriametrics/victoria-metrics:v1.150.0
    restart: unless-stopped
    networks:
      - domotique_net
    volumes:
      - ./VictoriaMetrics_Data:/victoria-metrics-data
    command:
      - "--storageDataPath=/victoria-metrics-data"
      - "--retentionPeriod=5y"
    ports:
      - "127.0.0.1:8428:8428"  # accès local uniquement (debug/requêtes API), jamais exposé publiquement

  grafana:
    container_name: grafana
    image: grafana/grafana:latest
    restart: unless-stopped
    networks:
      - domotique_net
    ports:
      - "3000:3000"
    volumes:
      - ./Grafana_Data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - TZ=${TZ}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=https://grafanabulle.malnoy.com
      - TESLAMATE_DB_PASSWORD=${TESLAMATE_DB_PASSWORD}  # utilisé par grafana/provisioning/datasources/teslamate.yml
    depends_on:
      - victoriametrics
      - teslamate-db

  doc-knx:
    container_name: doc-knx
    image: nginx:alpine
    restart: unless-stopped
    networks:
      - domotique_net
    ports:
      - "8090:80"  # accès LAN direct (docbulle.malnoy.com passe par le tunnel Cloudflare + Cloudflare Access)
    volumes:
      - ./docs_site:/usr/share/nginx/html:ro
      - ./docs_site_nginx/charset.conf:/etc/nginx/conf.d/charset.conf:ro
    # Documentation du projet (jalon 2 : inventaire KNX interactif). Contenu régénéré par
    # knx/scripts/build_html_report.py, jamais édité à la main dans docs_site/. Exposé
    # publiquement sur docbulle.malnoy.com via le tunnel Cloudflare (Public Hostname à
    # ajouter côté dashboard Zero Trust) et protégé par une politique Cloudflare Access
    # (email + code à usage unique) — voir README.md.

  tesla-key:
    container_name: tesla-key
    image: nginx:alpine
    restart: unless-stopped
    networks:
      - domotique_net
    ports:
      - "8091:80"  # accès LAN direct ; exposé publiquement sur vehiculebulle.malnoy.com via le tunnel Cloudflare
    volumes:
      - ./tesla_key_nginx:/usr/share/nginx/html:ro
    # Héberge la clé publique Tesla (jalon 4, intégration Tesla) à l'URL exigée par Tesla :
    # /.well-known/appspecific/com.tesla.3p.public-key.pem — nécessaire pour l'enregistrement
    # de l'app développeur Tesla (developer.tesla.com), même si la Model S (pré-2021) ne
    # nécessite pas la signature de commandes (clé virtuelle) pour le contrôle de base.
    # Clé privée correspondante : tesla/private/private-key.pem (non versionnée).

  teslamate-db:
    container_name: teslamate-db
    image: postgres:18-trixie
    restart: unless-stopped
    networks:
      - domotique_net
    environment:
      - POSTGRES_USER=teslamate
      - POSTGRES_PASSWORD=${TESLAMATE_DB_PASSWORD}
      - POSTGRES_DB=teslamate
    volumes:
      - ./TeslaMate_DB_Data:/var/lib/postgresql

  teslamate-mosquitto:
    container_name: teslamate-mosquitto
    image: eclipse-mosquitto:2
    restart: unless-stopped
    networks:
      - domotique_net
    command: mosquitto -c /mosquitto-no-auth.conf
    volumes:
      - ./TeslaMate_Mosquitto_Data/config:/mosquitto/config
      - ./TeslaMate_Mosquitto_Data/data:/mosquitto/data
    # Broker MQTT interne à TeslaMate (pas lié à la Fleet Telemetry Tesla, non supportée sur
    # Model S pré-2021) — utilisé pour la communication interne entre les composants TeslaMate.

  teslamate:
    container_name: teslamate
    image: teslamate/teslamate:latest
    restart: unless-stopped
    networks:
      - domotique_net
    ports:
      - "4000:4000"  # interface web TeslaMate (login Tesla, réglages) — accès LAN direct, pas exposé via le tunnel
    environment:
      - ENCRYPTION_KEY=${TESLAMATE_ENCRYPTION_KEY}
      - DATABASE_USER=teslamate
      - DATABASE_PASS=${TESLAMATE_DB_PASSWORD}
      - DATABASE_NAME=teslamate
      - DATABASE_HOST=teslamate-db
      - MQTT_HOST=teslamate-mosquitto
      - TESLA_AUTH_CLIENT_ID=${TESLA_CLIENT_ID}
      - TESLA_API_HOST=https://fleet-api.prd.eu.vn.cloud.tesla.com
      - TESLA_AUTH_HOST=https://auth.tesla.com
      - TESLA_AUTH_PATH=/oauth2/v3
    volumes:
      - ./TeslaMate_Import:/opt/app/import
    cap_drop:
      - all
    depends_on:
      - teslamate-db
      - teslamate-mosquitto
    # Historique/analytique (jalon 4) : trajets, charges, efficacité, via la Fleet API (pas le
    # streaming temps réel, non supporté sur Model S pré-2021 — désactiver "Use Fleet
    # Telemetry" dans les réglages TeslaMate après le premier login). Grafana bundlé
    # volontairement omis : dashboards importés dans le Grafana existant (datasource
    # "TeslaMate" provisionnée automatiquement, voir grafana/provisioning/).

  cloudflared:
    container_name: cloudflared
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    networks:
      - domotique_net
    extra_hosts:
      - "host.docker.internal:host-gateway"
      # Nécessaire pour que cloudflared puisse relayer vers des services qui ne sont
      # PAS sur domotique_net (ex. Tunet, jalon 5 dashboards — port 3002 publié sur
      # l'hôte mais conteneur sur un autre réseau Docker). Sans ce host_gateway
      # explicite, host.docker.internal n'est pas garanti résolvable depuis ce
      # conteneur (constaté le 30.08.2026 : 502 sur visubulle.malnoy.com sans cette
      # entrée, alors que Tunet lui-même en a besoin pour l'inverse — joindre HA).
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - homeassistant
      - grafana
      - doc-knx
      - tesla-key
