# Remplace le default.conf livré par l'image nginx:alpine (09.09.2026) — nécessaire pour ajouter
# le proxy /api/ vers dashboard-api ci-dessous ; nginx:alpine n'a pas de mécanisme d'include de
# location depuis conf.d, il faut donc reprendre le server{} complet. Comportement de base
# (racine, index, page d'erreur) identique à celui que l'image fournissait par défaut.
server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Écran Météo (07-09.09.2026, voir CAHIER_DES_CHARGES.md §4/§7) : proxy vers dashboard-api,
    # jamais exposé directement (pas de port publié, pas de sous-domaine propre). Même origine
    # que la page côté navigateur, donc aucun souci CORS.
    location /api/ {
        proxy_pass http://dashboard-api:8000/api/;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
